name: cleanup merged dev branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-dev.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged dev branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git push origin --delete dev
          fi

      - name: Remove temporary cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-dev.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:main
