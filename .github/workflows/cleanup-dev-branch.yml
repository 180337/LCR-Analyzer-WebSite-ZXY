name: cleanup dev branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-dev-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete dev branch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git push origin --delete dev
          fi

          git rm .github/workflows/cleanup-dev-branch.yml
          git commit -m "Remove one-shot dev cleanup workflow"
          git push origin HEAD:main
